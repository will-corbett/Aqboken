# Check the Kazakh against Wiktionary, run every check, and deploy the static site to GitHub Pages.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # The Kazakh Wiktionary extract (38 MB, kaikki.org) is cached per month, so the check runs against a fresh
      # copy once a month and otherwise against the same file.
      - name: Month for the source cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: raw
        uses: actions/cache@v6
        with:
          path: data-raw
          key: data-raw-${{ steps.month.outputs.month }}
      - if: steps.raw.outputs.cache-hit != 'true'
        run: npm run data:fetch
      - name: Check the Kazakh against Wiktionary
        run: npm run data:check
      - name: Upload the Wiktionary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiktionary-check
          path: reports/wiktionary-check.md

      # Computer-voice audio (scripts/tts.py, Piper + ISSAI's Kazakh voice): files from earlier runs are restored and
      # only new texts are voiced, so a run is quick unless the words or forms changed a lot. If any of this fails,
      # the site still deploys: "Hear it" then says there's no audio yet.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - name: Install Piper
        continue-on-error: true
        run: pip install -r scripts/requirements-audio.txt
      - id: voice
        uses: actions/cache@v6
        with:
          path: data-raw/piper
          key: piper-kk_KZ-issai-high-v1
      - name: Download the Kazakh voice
        if: steps.voice.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p data-raw/piper
          for f in kk_KZ-issai-high.onnx kk_KZ-issai-high.onnx.json; do
            curl -sSfL -o "data-raw/piper/$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/kk/kk_KZ/issai/high/$f"
          done
      - name: List the texts to voice
        run: npm run audio:texts
      - uses: actions/cache/restore@v6
        with:
          path: public/audio/tts
          key: audio-tts-${{ hashFiles('audio-tts/wanted.tsv', 'src/shared/audio.ts') }}
          restore-keys: audio-tts-
      - name: Voice new texts
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/tts.py data-raw/piper
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: public/audio/tts
          key: audio-tts-${{ hashFiles('audio-tts/wanted.tsv', 'src/shared/audio.ts') }}-${{ github.run_id }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub Pages sometimes leaves a deployment stuck; a fresh attempt usually gets through (as in Krotik).
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
